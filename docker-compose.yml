# Local API only. Frontend runs with pnpm dev on the host.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/signalprep.db
      APP_ENV: development
      DEV_AUTH: "true"
    volumes:
      - signalprep-data:/app/data
    restart: unless-stopped
volumes:
  signalprep-data:
